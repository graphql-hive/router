schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION)
{
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

type Book implements Node
  @join__implements(graph: CATALOG, interface: "Node")
  @join__type(graph: CATALOG, key: "id")
  @join__type(graph: REVIEWS, key: "id")
{
  id: ID!
  title: String @join__field(graph: CATALOG) @join__field(graph: REVIEWS, external: true)
  author: Person @join__field(graph: CATALOG)
  rating: Int @join__field(graph: REVIEWS)
  reviews: [Review!]! @join__field(graph: REVIEWS)
  failing: String @join__field(graph: REVIEWS)
  strict: String! @join__field(graph: REVIEWS)
  summary: String @join__field(graph: REVIEWS, requires: "title")
}

scalar join__FieldSet

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://0.0.0.0:4203/catalog")
  PEOPLE @join__graph(name: "people", url: "http://0.0.0.0:4203/people")
  REVIEWS @join__graph(name: "reviews", url: "http://0.0.0.0:4203/reviews")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Movie implements Node
  @join__implements(graph: CATALOG, interface: "Node")
  @join__type(graph: CATALOG, key: "id")
  @join__type(graph: REVIEWS, key: "id")
{
  id: ID!
  title: String @join__field(graph: CATALOG)
  director: Person @join__field(graph: CATALOG)
  rating: Int @join__field(graph: REVIEWS)
}

interface Node
  @join__type(graph: CATALOG)
{
  id: ID!
  title: String
}

type Person
  @join__type(graph: CATALOG, key: "id")
  @join__type(graph: PEOPLE, key: "id")
  @join__type(graph: REVIEWS, key: "id")
{
  id: ID!
  name: String! @join__field(graph: CATALOG) @join__field(graph: PEOPLE)
  email: String @join__field(graph: PEOPLE)
  age: Int @join__field(graph: PEOPLE)
}

type Query
  @join__type(graph: CATALOG)
  @join__type(graph: PEOPLE)
  @join__type(graph: REVIEWS)
{
  node(id: ID!): Node @join__field(graph: CATALOG)
  nodes: [Node!] @join__field(graph: CATALOG)
  search: [SearchResult!]! @join__field(graph: CATALOG)
  shelf: Shelf! @join__field(graph: CATALOG)
  book(id: ID!): Book @join__field(graph: CATALOG)
}

type Review
  @join__type(graph: REVIEWS)
{
  text: String!
  by: Person
}

union SearchResult
  @join__type(graph: CATALOG)
  @join__unionMember(graph: CATALOG, member: "Book")
  @join__unionMember(graph: CATALOG, member: "Movie")
  @join__unionMember(graph: CATALOG, member: "Person")
 = Book | Movie | Person

type Shelf
  @join__type(graph: CATALOG)
{
  label: String!
  items: [Node!]!
  broken: String
}