schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://127.0.0.1:1/catalog.graphql")
  RANKING @join__graph(name: "ranking", url: "http://127.0.0.1:1/ranking.graphql")
  SEARCH @join__graph(name: "search", url: "http://127.0.0.1:1/search.graphql")
}

type Query @join__type(graph: CATALOG) @join__type(graph: RANKING) @join__type(graph: SEARCH) {
  cage: Cage @join__field(graph: CATALOG)
}

type Cage @join__type(graph: CATALOG, key: "id") @join__type(graph: SEARCH, key: "id") {
  id: ID!
  listings: [Listing!] @join__field(graph: SEARCH)
}

type Dog implements Animal @join__type(graph: CATALOG, key: "id") @join__type(graph: RANKING, key: "id") @join__type(graph: SEARCH, key: "id") @join__implements(graph: CATALOG, interface: "Animal") @join__implements(graph: RANKING, interface: "Animal") @join__implements(graph: SEARCH, interface: "Animal") {
  id: ID!
  name: String @join__field(graph: CATALOG)
  tricks: Int @join__field(graph: CATALOG) @join__field(graph: RANKING, external: true)
}

type Cat implements Animal @join__type(graph: CATALOG, key: "id") @join__type(graph: RANKING, key: "id") @join__type(graph: SEARCH, key: "id") @join__implements(graph: CATALOG, interface: "Animal") @join__implements(graph: RANKING, interface: "Animal") @join__implements(graph: SEARCH, interface: "Animal") {
  id: ID!
  name: String @join__field(graph: CATALOG)
  whiskers: Int @join__field(graph: CATALOG) @join__field(graph: RANKING, external: true)
}

type Bird implements Animal @join__type(graph: CATALOG, key: "id") @join__type(graph: RANKING, key: "id") @join__type(graph: SEARCH, key: "id") @join__implements(graph: CATALOG, interface: "Animal") @join__implements(graph: RANKING, interface: "Animal") @join__implements(graph: SEARCH, interface: "Animal") {
  id: ID!
  name: String @join__field(graph: CATALOG)
}

type Listing @join__type(graph: RANKING, key: "id") @join__type(graph: SEARCH, key: "id") {
  id: ID!
  pet: Animal @join__field(graph: RANKING, external: true) @join__field(graph: SEARCH)
  rank: Float @join__field(
    graph: RANKING
    requires: "pet{__typename ...on Dog{tricks}...on Cat{whiskers}}"
  )
}

interface Animal @join__type(graph: CATALOG, key: "id") @join__type(graph: RANKING, key: "id") @join__type(graph: SEARCH, key: "id") {
  id: ID!
  name: String @join__field(graph: CATALOG)
}