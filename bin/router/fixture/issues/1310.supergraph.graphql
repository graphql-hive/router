schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CLINIC @join__graph(name: "clinic", url: "http://127.0.0.1:1/clinic.graphql")
  PROFILES @join__graph(name: "profiles", url: "http://127.0.0.1:1/profiles.graphql")
  RECORDS @join__graph(name: "records", url: "http://127.0.0.1:1/records.graphql")
}

type Query @join__type(graph: CLINIC) @join__type(graph: PROFILES) @join__type(graph: RECORDS) {
  pet: Pet @join__field(graph: CLINIC)
}

type Pet @join__type(graph: CLINIC, key: "id") @join__type(graph: PROFILES, key: "id") @join__type(graph: RECORDS, key: "id") {
  id: ID!
  weight: Int @join__field(graph: CLINIC, external: true) @join__field(graph: RECORDS)
  age: Int @join__field(graph: CLINIC, external: true) @join__field(graph: PROFILES)
  checkup: Checkup @join__field(graph: CLINIC, requires: "weight age")
}

type Checkup @join__type(graph: CLINIC, key: "id") @join__type(graph: RECORDS, key: "id") {
  id: ID!
  fee: Int @join__field(graph: CLINIC, external: true) @join__field(graph: RECORDS)
  grade: Int @join__field(graph: CLINIC, requires: "fee")
}