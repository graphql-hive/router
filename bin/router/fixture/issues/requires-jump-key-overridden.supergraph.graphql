schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.4", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
  overrideLabel: String
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  HEAD @join__graph(name: "head", url: "http://localhost:4200/requires-jump-key-overridden/head")
  LEGACY @join__graph(
    name: "legacy"
    url: "http://localhost:4200/requires-jump-key-overridden/legacy"
  )
  OTHER @join__graph(name: "other", url: "http://localhost:4200/requires-jump-key-overridden/other")
  SOURCE @join__graph(
    name: "source"
    url: "http://localhost:4200/requires-jump-key-overridden/source"
  )
}

type Item @join__type(graph: HEAD, key: "code") @join__type(graph: LEGACY, key: "code") @join__type(graph: OTHER, key: "id") @join__type(graph: SOURCE, key: "code") {
  code: String! @join__field(graph: HEAD) @join__field(graph: LEGACY) @join__field(graph: SOURCE)
  id: ID! @join__field(graph: HEAD) @join__field(graph: LEGACY, overrideLabel: "id_in_source") @join__field(graph: OTHER) @join__field(graph: SOURCE, override: "legacy", overrideLabel: "id_in_source")
  weight: Int @join__field(graph: HEAD, external: true) @join__field(graph: OTHER)
  price: Int @join__field(graph: HEAD, requires: "weight")
}

type Query @join__type(graph: HEAD) @join__type(graph: LEGACY) @join__type(graph: OTHER) @join__type(graph: SOURCE) {
  items: [Item!]! @join__field(graph: SOURCE)
}