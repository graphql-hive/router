schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
  overrideLabel: String
  contextArguments: [join__ContextArgument!]
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

directive @join__implements(
  graph: join__Graph!
  interface: String!
) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(
  graph: join__Graph!
  member: String!
) repeatable on UNION

scalar join__FieldSet

scalar join__FieldValue

directive @link(
  url: String
  as: String
  for: link__Purpose
  import: [link__Import]
) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  SECURITY
  EXECUTION
}

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "")
  ORDERS @join__graph(name: "orders", url: "")
  USERS @join__graph(name: "users", url: "")
}

type Order
  @join__type(graph: CATALOG, key: "id")
  @join__type(graph: ORDERS, key: "id") {
  id: ID!
  sku: String!
    @join__field(graph: CATALOG, external: true)
    @join__field(graph: ORDERS)
  name: String! @join__field(graph: CATALOG, requires: "sku")
}

type Query
  @join__type(graph: CATALOG)
  @join__type(graph: ORDERS)
  @join__type(graph: USERS) {
  order: Order @join__field(graph: ORDERS)
  user: User @join__field(graph: USERS)
}

type User
  @join__type(graph: ORDERS, key: "id")
  @join__type(graph: USERS, key: "id") {
  id: ID!
  orders: [Order!]! @join__field(graph: ORDERS)
}
