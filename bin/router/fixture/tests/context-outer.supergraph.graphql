schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) @link(url: "https://specs.apollo.dev/context/v0.1", for: SECURITY) @link(url: "https://specs.apollo.dev/inaccessible/v0.2", for: SECURITY) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
  overrideLabel: String
  contextArguments: [join__ContextArgument!]
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

scalar join__FieldValue

directive @context(name: String!) repeatable on OBJECT | INTERFACE | UNION

directive @context__fromContext(field: context__ContextFieldValue) on ARGUMENT_DEFINITION

scalar context__ContextFieldValue

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

directive @inaccessible on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | ENUM_VALUE | SCALAR | INPUT_OBJECT | INPUT_FIELD_DEFINITION | ARGUMENT_DEFINITION

enum join__Graph {
  A @join__graph(name: "a", url: "")
  B @join__graph(name: "b", url: "")
}

type Query @join__type(graph: A) @join__type(graph: B) {
  outer: Outer @join__field(graph: A)
  _empty: String @join__field(graph: B) @inaccessible
}

type User implements Account @join__type(graph: A, key: "id") @join__implements(graph: A, interface: "Account") @context(name: "a__user") {
  id: ID!
  currency: String
  child: User
  wrapper: Wrapper
  entries: [Entry]
  txs: [Transaction]
}

type Other implements Account @join__type(graph: A) @join__implements(graph: A, interface: "Account") @context(name: "a__user") {
  currency: String
  txs: [Transaction]
}

type Wrapper @join__type(graph: A) {
  txs: [Transaction]
}

type Outer @join__type(graph: A) @context(name: "a__outer") {
  code: String
  user: User
}

type Adjustment @join__type(graph: A, key: "id") {
  id: ID!
  amount: Int @join__field(
    graph: A
    contextArguments: [{context: "a__outer", name: "code", type: "String", selection: " { code }"}]
  )
}

type Transaction @join__type(graph: A, key: "id") @join__type(graph: B, key: "id") {
  id: ID!
  base: Int @join__field(graph: A, external: true) @join__field(graph: B)
  amount(multiplier: Int): Int @join__field(
    graph: A
    contextArguments: [{context: "a__user", name: "code", type: "String", selection: " { currency }"}]
  )
  required(multiplier: Int): Int @join__field(
    graph: A
    requires: "base"
    contextArguments: [{context: "a__user", name: "code", type: "String", selection: " { currency }"}]
  )
  fromInterface: Int @join__field(
    graph: A
    contextArguments: [{context: "a__account", name: "code", type: "String", selection: " { currency }"}]
  )
  fromUnion: Int @join__field(
    graph: A
    contextArguments: [{context: "a__viewer", name: "code", type: "String", selection: " ... on User { currency } ... on Other { currency }"}]
  )
  multiple: Int @join__field(
    graph: A
    contextArguments: [{context: "a__user", name: "code", type: "String", selection: " { currency }"}, {context: "a__outer", name: "outer", type: "String", selection: " { code }"}]
  )
}

interface Account @join__type(graph: A) @context(name: "a__account") {
  currency: String
  txs: [Transaction]
}

union Entry @join__type(graph: A) @join__unionMember(graph: A, member: "Transaction") @join__unionMember(graph: A, member: "Adjustment") = Transaction | Adjustment

union Viewer @join__type(graph: A) @join__unionMember(graph: A, member: "User") @join__unionMember(graph: A, member: "Other") @context(name: "a__viewer") = User | Other