schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CARD @join__graph(name: "card", url: "http://0.0.0.0:4200/card")
  PRODUCT @join__graph(name: "product", url: "http://0.0.0.0:4200/product")
}

type Query @join__type(graph: CARD) @join__type(graph: PRODUCT) {
  card: ProductCard @join__field(graph: CARD)
}

type ProductCard @join__type(graph: CARD, key: "id") {
  id: ID!
  components: [Component]
}

type Product @join__type(graph: CARD, key: "id") @join__type(graph: PRODUCT, key: "id") {
  id: ID!
  a: String! @join__field(graph: PRODUCT)
  b: String! @join__field(graph: PRODUCT)
  c: String! @join__field(graph: PRODUCT)
}

type ComponentA @join__type(graph: CARD) {
  product: Product
}

type ComponentB @join__type(graph: CARD) {
  product: Product
}

type ComponentC @join__type(graph: CARD) {
  product: Product
}

union Component @join__type(graph: CARD) @join__unionMember(graph: CARD, member: "ComponentA") @join__unionMember(graph: CARD, member: "ComponentB") @join__unionMember(graph: CARD, member: "ComponentC") = ComponentA | ComponentB | ComponentC