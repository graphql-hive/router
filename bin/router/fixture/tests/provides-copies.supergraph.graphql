schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "")
  NAMES @join__graph(name: "names", url: "")
  ORDERS @join__graph(name: "orders", url: "")
  SOCIAL @join__graph(name: "social", url: "")
  USERS @join__graph(name: "users", url: "")
}

type ZOrder @join__type(graph: CATALOG, key: "id") @join__type(graph: ORDERS, key: "id") {
  id: ID!
  sku: String! @join__field(graph: CATALOG) @join__field(graph: ORDERS, external: true)
  product: Product! @join__field(graph: ORDERS, provides: "name")
}

type Product @join__type(graph: CATALOG) @join__type(graph: ORDERS) {
  name: String! @join__field(graph: CATALOG) @join__field(graph: ORDERS, external: true)
}

type Query @join__type(graph: CATALOG) @join__type(graph: NAMES) @join__type(graph: ORDERS) @join__type(graph: SOCIAL) @join__type(graph: USERS) {
  product: Product @join__field(graph: CATALOG)
  user: User @join__field(graph: USERS)
}

type User @join__type(graph: NAMES, key: "id") @join__type(graph: ORDERS, key: "id") @join__type(graph: SOCIAL, key: "id") @join__type(graph: USERS, key: "id") {
  id: ID!
  name: String! @join__field(graph: NAMES) @join__field(graph: SOCIAL, external: true)
  orders: [ZOrder!]! @join__field(graph: ORDERS, provides: "sku")
  related: User! @join__field(graph: SOCIAL, provides: "name")
  label: String! @join__field(graph: SOCIAL, requires: "name")
}