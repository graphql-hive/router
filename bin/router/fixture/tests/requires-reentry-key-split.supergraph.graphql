schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "")
  INVENTORY @join__graph(name: "inventory", url: "")
  PRODUCTS @join__graph(name: "products", url: "")
  REGIONS @join__graph(name: "regions", url: "")
  SHIPPING @join__graph(name: "shipping", url: "")
}

type Product @join__type(graph: CATALOG, key: "id") @join__type(graph: INVENTORY, key: "sku") @join__type(graph: PRODUCTS, key: "id") @join__type(graph: REGIONS, key: "id") @join__type(graph: SHIPPING, key: "id sku region") {
  id: ID! @join__field(graph: CATALOG) @join__field(graph: PRODUCTS) @join__field(graph: REGIONS) @join__field(graph: SHIPPING)
  sku: String! @join__field(graph: CATALOG) @join__field(graph: INVENTORY) @join__field(graph: SHIPPING)
  weight: Int @join__field(graph: INVENTORY) @join__field(graph: SHIPPING, external: true)
  region: String! @join__field(graph: REGIONS) @join__field(graph: SHIPPING)
  shippingEstimate: Int @join__field(graph: SHIPPING, requires: "weight")
  carrier: String @join__field(graph: SHIPPING)
}

type Query @join__type(graph: CATALOG) @join__type(graph: INVENTORY) @join__type(graph: PRODUCTS) @join__type(graph: REGIONS) @join__type(graph: SHIPPING) {
  product: Product @join__field(graph: PRODUCTS)
}