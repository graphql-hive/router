enum join__Graph {
  A @join__graph(name: "a", url: "http://a")
}

type Query @join__type(graph: A) {
  viewer: Viewer
}

union Viewer @join__type(graph: A) @join__unionMember(graph: A, member: "User") @join__unionMember(graph: A, member: "Other") = User | Other

type User @join__type(graph: A) @context(name: "a__user") {
  currency: String
  txs: [Transaction]
}

type Other @join__type(graph: A) @context(name: "a__other") {
  currency: String
  txs: [Adjustment]
}

type Transaction @join__type(graph: A, key: "id") {
  id: ID!
  amount: Int @join__field(graph: A, contextArguments: [
    {context: "a__user", name: "code", type: "String!", selection: "{ currency }"}
  ])
}

type Adjustment @join__type(graph: A, key: "id") {
  id: ID!
  amount: Int @join__field(graph: A, contextArguments: [
    {context: "a__other", name: "code", type: "String!", selection: "{ currency }"}
  ])
}
