schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "")
  ORDERS @join__graph(name: "orders", url: "")
  USERS @join__graph(name: "users", url: "")
}

type Query @join__type(graph: CATALOG) @join__type(graph: ORDERS) @join__type(graph: USERS) {
  store: Store @join__field(graph: CATALOG)
  user: User @join__field(graph: USERS)
}

type Store @join__type(graph: CATALOG, key: "id") @join__type(graph: ORDERS, key: "id") {
  id: ID!
  orders: [Order!]! @join__field(graph: ORDERS, provides: "weight")
}

type Order @join__type(graph: CATALOG, key: "id") @join__type(graph: ORDERS, key: "id") {
  id: ID!
  sku: String! @join__field(graph: CATALOG) @join__field(graph: ORDERS, external: true)
  weight: Int! @join__field(graph: CATALOG) @join__field(graph: ORDERS, external: true)
  media: Media! @join__field(graph: ORDERS)
  label: String! @join__field(graph: ORDERS, requires: "sku")
  mediaLabel: String! @join__field(graph: ORDERS, requires: "media{...on Book{isbn}}")
}

type Book implements Media @join__type(graph: CATALOG, key: "id") @join__type(graph: ORDERS, key: "id") @join__implements(graph: ORDERS, interface: "Media") {
  id: ID!
  isbn: String! @join__field(graph: CATALOG) @join__field(graph: ORDERS, external: true)
}

type User @join__type(graph: ORDERS, key: "id") @join__type(graph: USERS, key: "id") {
  id: ID!
  orders: [Order!]! @join__field(graph: ORDERS, provides: "sku media{...on Book{isbn}}")
  pastOrders: [Order!]! @join__field(graph: ORDERS)
}

type Movie implements Media @join__type(graph: ORDERS, key: "id") @join__implements(graph: ORDERS, interface: "Media") {
  id: ID!
}

interface Media @join__type(graph: ORDERS) {
  id: ID!
}