schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
  mutation: Mutation
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(
  graph: join__Graph!
  interface: String!
) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(
  graph: join__Graph!
  member: String!
) repeatable on UNION

directive @link(
  url: String
  as: String
  for: link__Purpose
  import: [link__Import]
) repeatable on SCHEMA

scalar join__FieldSet

enum join__Graph {
  FIRST @join__graph(name: "first", url: "http://localhost:4200/first")
  SECOND @join__graph(name: "second", url: "http://localhost:4200/second")
  THIRD @join__graph(name: "third", url: "http://localhost:4200/third")
  ITEMS @join__graph(name: "items", url: "http://localhost:4200/items")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Item @join__type(graph: FIRST, key: "id") @join__type(graph: ITEMS, key: "id") {
  id: ID!
  value: String @join__field(graph: ITEMS)
}

type Mutation
  @join__type(graph: FIRST)
  @join__type(graph: SECOND)
  @join__type(graph: THIRD) {
  selectItem(id: ID!): Item @join__field(graph: FIRST)
  checkpoint: Boolean @join__field(graph: SECOND)
  updateItem(id: ID!, value: String!): Boolean @join__field(graph: THIRD)
}

type Query
  @join__type(graph: FIRST)
  @join__type(graph: SECOND)
  @join__type(graph: THIRD)
  @join__type(graph: ITEMS) {
  _empty: String @join__field(graph: FIRST)
}
