name: ci
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # release commits get their own group so a later push to main cannot cancel them
  group: ${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'chore(release)') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  issues: read
  checks: write
  pull-requests: write

env:
  NEXTEST_VERSION: 0.9.146

jobs:
  unit:
    name: test / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: test all
        run: cargo test_all
        timeout-minutes: 15
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
  e2e:
    name: test / e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: build hive_router binary
        # Needed for the e2e tests that spawn the real compiled binary as a subprocess
        # (e.g. to send it a real SIGTERM) instead of running it in-process.
        run: cargo build -p hive-router --bin hive_router --features testing
      - name: test e2e
        # --run-ignored all also runs #[ignore]'d tests, e.g. ones that spawn the real
        # hive_router binary and require it pre-built (skipped by default locally).
        run: cargo test_e2e --run-ignored all
        timeout-minutes: 10
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug

      - name: memory baseline
        run: cargo run -p e2e --bin memory_baseline
        timeout-minutes: 10
        env:
          RUST_BACKTRACE: full
          RUST_LOG: info

  plugin_examples:
    name: test / plugin examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: ${{ hashFiles('**/Cargo.lock') }}
      - name: install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: test plugin examples
        run: cargo test_plugin_examples
        timeout-minutes: 15
        working-directory: plugin_examples
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug

  node-addon-test:
    name: test / node-addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - name: build
        run: npm run build:debug
        working-directory: lib/node-addon
      - name: test
        working-directory: lib/node-addon
        run: npm test

  build:
    name: check / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: build
        run: cargo build --release

  fmt:
    name: check / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
      - name: cargo fmt
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1

  clippy:
    name: check / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --all

  semver-checks:
    name: breaking changes / hive-router crate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: hive-router
          baseline-rev: origin/main

  differential:
    name: test / differential
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: true
      NODE_ENV: production
      GRAPHQL_DIFF_QUERIES: 250
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: ${{ hashFiles('**/Cargo.lock') }}
      - name: setup node
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - name: build resources
        run: |
          cargo build -p subgraphs
          cargo build -p hive-router
      - name: Run subgraphs
        run: |
          ./target/debug/subgraphs &
          echo "$!" > subgraphs.pid
          sleep 5
      - name: Run router
        run: |
          ./target/debug/hive_router &
          echo "$!" > router.pid
          sleep 5
        env:
          ROUTER_CONFIG_FILE_PATH: bench/configs/default.config.yaml
      - name: Run monolith baseline
        run: |
          npm start --workspace=monolith-js &
          echo "$!" > monolith.pid
          sleep 5
      - name: Run differential test
        run: |
          cargo run -p graphql-differential -- \
            http://localhost:4300/graphql \
            http://localhost:4000/graphql \
            bench/schema.graphql
        timeout-minutes: 15
        env:
          GRAPHQL_DIFF_QUERIES: 5000
      - name: Stop services
        if: always()
        run: |
          for pid_file in monolith.pid router.pid subgraphs.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
      - name: Upload failed test cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: differential-failed-tests
          path: failed-tests/

  graphql-over-http:
    name: test / graphql-over-http
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: setup node
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - name: Run Audits
        run: npm run ci:test:graphql-over-http
        working-directory: audits

  federation-audit:
    name: test / federation-audit
    runs-on: ubuntu-latest
    env:
      GATEWAY_TIMEOUT: 1800000 # 30 minutes, to prevent CI timeout for long-running tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: setup node
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - name: Run Audits
        run: npm run test:federation-all
        working-directory: audits
        continue-on-error: true # continue even if the test fails
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: federation-audit-logs
          path: |
            ./audits/logs/*.log
      - name: Run Audits (experimental_abstract_type_folding)
        run: npm run test:federation-all
        env:
          QUERY_PLANNER_EXPERIMENTAL_ABSTRACT_TYPE_FOLDING: true
        working-directory: audits
        continue-on-error: true # continue even if the test fails
