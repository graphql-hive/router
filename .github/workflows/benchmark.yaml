name: benchmark
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # read lets the PR job download the router binary built on main
  actions: read
  contents: read

jobs:
  benchmark:
    strategy:
      matrix:
        include:
          - name: "graphql-tools"
            package: "./lib/graphql-tools"
            bench_args: ""
          - name: "query-planner"
            package: "./bin/router"
            bench_args: "--bench qp_benches"
          - name: "executor"
            package: "./bin/router"
            bench_args: "--bench executor_benches --bench demand_control_benches --bench coprocessor_benches"
          - name: "router"
            package: "./bin/router"
            bench_args: "--features testing --bench persisted_documents_matcher_benches --bench router_benches"
    name: benchmark / ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - if: matrix.name == 'executor'
        name: Build subgraphs
        run: cargo build --release -p subgraphs
      - if: matrix.name == 'executor'
        name: Run subgraphs
        run: ./target/release/subgraphs & sleep 5
      - name: Run benchmarks
        run: cargo bench ${{ matrix.bench_args }}
        working-directory: ${{ matrix.package }}
      - name: Upload benchmark results
        if: always() # Upload results even if benchmarks fail
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{matrix.package}}-benchmark-results
          path: ${{matrix.package}}/target/criterion

  router-benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "default"
            args: ""
            package: "hive-router"
            binary: "hive_router"
            config: "bench/configs/default.config.yaml"
            compare_with_default: true
            main_binary: "default"
          - name: "dedupe-inbound"
            args: ""
            package: "hive-router"
            binary: "hive_router"
            config: "bench/configs/dedupe-inbound.config.yaml"
            compare_with_default: false
            main_binary: "default"
          - name: "no-dedupe"
            args: ""
            package: "hive-router"
            binary: "hive_router"
            config: bench/configs/no-deduplication.config.yaml
            compare_with_default: false
            main_binary: "default"
          - name: "hive-tracing"
            # turns otlp http/grpc to noop
            args: "--features noop_otlp_exporter"
            package: "hive-router"
            binary: "hive_router"
            config: bench/configs/hive-tracing.config.yaml
            compare_with_default: false
            main_binary: "otel"
          - name: "otel"
            # turns otlp http/grpc to noop
            args: "--features noop_otlp_exporter"
            package: "hive-router"
            binary: "hive_router"
            config: bench/configs/otel.config.yaml
            compare_with_default: false
            main_binary: "otel"
          - name: "plugins"
            args: ""
            package: "plugin-template"
            binary: "hive_router_with_plugin"
            config: "bench/configs/plugins.config.yaml"
            compare_with_default: true
            main_binary: "default"
          - name: "persisted-documents"
            args: ""
            package: "hive-router"
            binary: "hive_router"
            config: "bench/configs/persisted-documents.config.yaml"
            compare_with_default: true
            main_binary: "default"
    name: benchmark / router / ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: true
      NODE_ENV: production
      GITHUB_PR: ${{ github.event.number }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Setup wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk
      - name: Build subgraphs
        run: cargo build --release -p subgraphs
      - name: Run subgraphs
        run: ./target/release/subgraphs & sleep 5
      - name: Build router
        run: cargo build --release -p ${{ matrix.package }} ${{matrix.args}}
      - name: Run router
        run: |
          ./target/release/${{ matrix.binary }} &
          echo "$!" > router.pid
          sleep 5
        env:
          ROUTER_CONFIG_FILE_PATH: ${{matrix.config}}
      - name: Run benchmark for ${{ github.ref }}
        if: github.event_name == 'pull_request'
        run: ./bench/run-benchmark.sh
        env:
          SUMMARY_PATH: ./bench/results/pr
          BENCH_PERSISTED_MODE: ${{ matrix.name == 'persisted-documents' && 'true' || '' }}
          BENCH_DOCUMENT_ID: ${{ matrix.name == 'persisted-documents' && 'bench_test_query' || '' }}
      # On main, keep the built router around so PRs can compare against it without building main.
      - name: Upload router binary for main
        if: github.event_name == 'push' && matrix.name == matrix.main_binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: router-main-${{ matrix.main_binary }}
          path: target/release/hive_router
          retention-days: 30
      - name: Download router binary built on main
        id: main-binary
        if: github.event_name == 'pull_request'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p main-bin
          # push events only come from this repo, so forks can't plant a "main" binary
          for run_id in $(gh run list --workflow benchmark.yaml --branch main --event push --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --name "router-main-${{ matrix.main_binary }}" --dir main-bin; then
              chmod +x main-bin/hive_router
              echo "Using hive_router built on main in run $run_id"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No router binary from main found, building main from source"
      - name: Checkout main branch in a separate directory
        if: github.event_name == 'pull_request' && steps.main-binary.outputs.found != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-branch
      - name: Build router from main branch
        if: github.event_name == 'pull_request' && steps.main-binary.outputs.found != 'true'
        run: |
          cargo build --release -p hive-router ${{ matrix.main_binary == 'otel' && '--features noop_otlp_exporter' || '' }}
          cp target/release/hive_router ../main-bin/
        working-directory: main-branch
      - name: Run router from main branch
        if: github.event_name == 'pull_request'
        run: |
          kill $(cat router.pid)
          ./main-bin/hive_router &
          sleep 5
        env:
          ROUTER_CONFIG_FILE_PATH: ${{ matrix.compare_with_default && 'bench/configs/default.config.yaml' || matrix.config }}

      - name: Run benchmark for main
        if: github.event_name == 'pull_request'
        run: ./bench/run-benchmark.sh
        env:
          SUMMARY_PATH: ./bench/results/main
      - name: Compare benchmark results
        if: github.event_name == 'pull_request'
        run: |
          chmod +x ./bench/ci-detect-regression.sh
          ./bench/ci-detect-regression.sh

