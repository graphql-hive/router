name: benchmark
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # read lets the PR job download the router binary built on main
  actions: read
  contents: read

jobs:
  benchmark:
    strategy:
      matrix:
        include:
          - name: "graphql-tools"
            package: "./lib/graphql-tools"
            bench_args: ""
          - name: "query-planner"
            package: "./bin/router"
            bench_args: "--bench qp_benches --bench graph_benches"
          - name: "executor"
            package: "./bin/router"
            bench_args: "--bench executor_benches --bench demand_control_benches --bench coprocessor_benches"
          - name: "router"
            package: "./bin/router"
            bench_args: "--features testing --bench persisted_documents_matcher_benches --bench router_benches"
    name: benchmark / ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - if: matrix.name == 'executor'
        name: Build subgraphs
        run: cargo build --release -p subgraphs
      - if: matrix.name == 'executor'
        name: Run subgraphs
        run: ./target/release/subgraphs & sleep 5
      - name: Run benchmarks
        run: cargo bench ${{ matrix.bench_args }}
        working-directory: ${{ matrix.package }}
      - name: Upload benchmark results
        if: always() # Upload results even if benchmarks fail
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{matrix.package}}-benchmark-results
          path: ${{matrix.package}}/target/criterion
      # main only: the numbers go to the bench history, see store-benchmarks below
      - name: Collect benchmark numbers
        if: github.event_name == 'push'
        run: ./bench/ci-collect-criterion.sh ${{ matrix.name }} > bench-numbers.json
      - name: Upload benchmark numbers
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-numbers-${{ matrix.name }}
          path: bench-numbers.json

  # Appends this commit's numbers (criterion and wrk) to data.json on the bench-history branch,
  # next to bench/history/index.html, which charts them.
  store-benchmarks:
    name: benchmark / store
    # store whatever finished, one failed bench shouldn't drop the rest
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [benchmark, router-benchmark]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bench-numbers-*
          path: numbers
      - name: Append to bench history
        run: |
          if git fetch --depth 1 origin bench-history; then
            git worktree add history FETCH_HEAD
          else
            git worktree add --orphan -b bench-history history
          fi
          [ -f history/data.json ] || echo '[]' > history/data.json

          shopt -s nullglob
          files=(numbers/*/bench-numbers.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No benchmark numbers to store"
            exit 0
          fi
          jq -s add "${files[@]}" > merged.json
          jq --slurpfile benches merged.json \
            --arg sha "$GITHUB_SHA" \
            --arg date "$(git log -1 --format=%cI)" \
            --arg msg "$(git log -1 --format=%s)" \
            '. + [{sha: $sha, date: $date, msg: $msg, benches: $benches[0]}]' \
            history/data.json > data.json
          mv data.json history/data.json
          cp bench/history/index.html history/

          cd history
          # GitHub Pages serves this branch, .nojekyll skips its Jekyll build
          touch .nojekyll
          git add data.json index.html .nojekyll
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "bench: ${GITHUB_SHA::8}"
          git push origin HEAD:bench-history

  # Builds every binary the router benchmarks need once, instead of once per config.
  # On PRs it also gets main's build of the default and otel routers to compare against.
  build-bench-binaries:
    strategy:
      matrix:
        include:
          - name: "default"
            package: "hive-router"
            args: ""
            binary: "hive_router"
            main: true
          - name: "otel"
            package: "hive-router"
            # turns otlp http/grpc to noop
            args: "--features noop_otlp_exporter"
            binary: "hive_router"
            main: true
          - name: "plugins"
            package: "plugin-template"
            args: ""
            binary: "hive_router_with_plugin"
            main: false
          - name: "subgraphs"
            package: "subgraphs"
            args: ""
            binary: "subgraphs"
            main: false
    name: benchmark / build / ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Build ${{ matrix.package }}
        run: cargo build --release -p ${{ matrix.package }} ${{ matrix.args }}
      # On main, keep the routers for 30 days so PRs can compare against them without building main.
      - name: Upload ${{ matrix.binary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-bin-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          retention-days: ${{ github.event_name == 'push' && matrix.main && 30 || 3 }}
      - name: Download ${{ matrix.binary }} built on main
        id: main-binary
        if: github.event_name == 'pull_request' && matrix.main
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p main-bin
          # push events only come from this repo, so forks can't plant a "main" binary
          for run_id in $(gh run list --workflow benchmark.yaml --branch main --event push --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --name "bench-bin-${{ matrix.name }}" --dir main-bin; then
              echo "Using ${{ matrix.binary }} built on main in run $run_id"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No ${{ matrix.binary }} from main found, building main from source"
      - name: Checkout main branch in a separate directory
        if: github.event_name == 'pull_request' && matrix.main && steps.main-binary.outputs.found != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-branch
      - name: Build ${{ matrix.package }} from main branch
        if: github.event_name == 'pull_request' && matrix.main && steps.main-binary.outputs.found != 'true'
        run: |
          cargo build --release -p ${{ matrix.package }} ${{ matrix.args }}
          cp target/release/${{ matrix.binary }} ../main-bin/
        working-directory: main-branch
      - name: Upload ${{ matrix.binary }} from main
        if: github.event_name == 'pull_request' && matrix.main
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-bin-${{ matrix.name }}-main
          path: main-bin/${{ matrix.binary }}
          retention-days: 3

  router-benchmark:
    needs: build-bench-binaries
    strategy:
      fail-fast: false
      matrix:
        # build: which bench-bin-* router to run, main_binary: which main router to compare with
        include:
          - name: "default"
            build: "default"
            binary: "hive_router"
            config: "bench/configs/default.config.yaml"
            compare_with_default: true
            main_binary: "default"
          - name: "dedupe-inbound"
            build: "default"
            binary: "hive_router"
            config: "bench/configs/dedupe-inbound.config.yaml"
            compare_with_default: false
            main_binary: "default"
          - name: "no-dedupe"
            build: "default"
            binary: "hive_router"
            config: bench/configs/no-deduplication.config.yaml
            compare_with_default: false
            main_binary: "default"
          - name: "hive-tracing"
            build: "otel"
            binary: "hive_router"
            config: bench/configs/hive-tracing.config.yaml
            compare_with_default: false
            main_binary: "otel"
          - name: "otel"
            build: "otel"
            binary: "hive_router"
            config: bench/configs/otel.config.yaml
            compare_with_default: false
            main_binary: "otel"
          - name: "plugins"
            build: "plugins"
            binary: "hive_router_with_plugin"
            config: "bench/configs/plugins.config.yaml"
            compare_with_default: true
            main_binary: "default"
          - name: "persisted-documents"
            build: "default"
            binary: "hive_router"
            config: "bench/configs/persisted-documents.config.yaml"
            compare_with_default: true
            main_binary: "default"
    name: benchmark / router / ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: true
      NODE_ENV: production
      GITHUB_PR: ${{ github.event.number }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bench-bin-subgraphs
          path: bin/subgraphs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bench-bin-${{ matrix.build }}
          path: bin/router
      - if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bench-bin-${{ matrix.main_binary }}-main
          path: bin/main
      # artifacts don't keep the executable bit
      - name: Make binaries executable
        run: chmod +x bin/*/*
      - name: Run subgraphs
        run: ./bin/subgraphs/subgraphs & sleep 5
      - name: Run router
        run: |
          ./bin/router/${{ matrix.binary }} &
          echo "$!" > router.pid
          sleep 5
        env:
          ROUTER_CONFIG_FILE_PATH: ${{matrix.config}}
      # runs on main too, so its numbers can go to the bench history
      - name: Run benchmark for ${{ github.ref }}
        run: ROUTER_PID=$(cat router.pid) ./bench/run-benchmark.sh
        env:
          SUMMARY_PATH: ./bench/results/pr
          BENCH_PERSISTED_MODE: ${{ matrix.name == 'persisted-documents' && 'true' || '' }}
          BENCH_DOCUMENT_ID: ${{ matrix.name == 'persisted-documents' && 'bench_test_query' || '' }}
      # ids ending in /rps are requests per second, the rest are nanoseconds like criterion's
      - name: Collect benchmark numbers
        if: github.event_name == 'push'
        run: |
          jq --arg id "wrk/${{ matrix.name }}" '
            def ns(us): if us == null then null else us * 1000 end;
            {
              ($id + "/rps"): .rate_rps,
              ($id + "/latency p50"): ns(.latency_p50_us),
              ($id + "/latency p90"): ns(.latency_p90_us),
              ($id + "/latency p99"): ns(.latency_p99_us),
              ($id + "/cpu per request p50"): ns(.cpu_per_request_p50_us),
              ($id + "/cpu per request p90"): ns(.cpu_per_request_p90_us),
              ($id + "/cpu per request p99"): ns(.cpu_per_request_p99_us)
            } | with_entries(select(.value != null))
          ' bench/results/pr/summary.json > bench-numbers.json
      - name: Upload benchmark numbers
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-numbers-wrk-${{ matrix.name }}
          path: bench-numbers.json
      - name: Run router from main branch
        if: github.event_name == 'pull_request'
        run: |
          kill $(cat router.pid)
          ./bin/main/hive_router &
          sleep 5
        env:
          ROUTER_CONFIG_FILE_PATH: ${{ matrix.compare_with_default && 'bench/configs/default.config.yaml' || matrix.config }}

      - name: Run benchmark for main
        if: github.event_name == 'pull_request'
        run: ./bench/run-benchmark.sh
        env:
          SUMMARY_PATH: ./bench/results/main
      - name: Compare benchmark results
        if: github.event_name == 'pull_request'
        run: |
          chmod +x ./bench/ci-detect-regression.sh
          ./bench/ci-detect-regression.sh
